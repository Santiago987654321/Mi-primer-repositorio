<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
</head>
<body>
    <h1>Formularios</h1>
    <form>
        <label for="nombre">Nombre:</label>
        <input type="text" name="nombre" id="nombre">

        <label for="apellido">Apellido:</label>
        <input type="text" name="apellido" id="apellido">

        <label for="perfil_usuario">Nombre de usuario:</label>
        <input type="text" name="perfil_usuario" id="perfil_usuario">

        <label for="email">Email:</label>
        <input type="email" name="email" id="email">

        <label for="fecha_nacimiento">Fecha de nacimiento:</label>
        <input type="date" name="fecha_nacimiento" id="fecha_nacimiento">

        <label for="domicilio">Domicilio:</label>
        <input type="text" name="domicilio" id="domicilio">

        <h3>¿Te gustaría comprar o vender?</h3>
        <label for="comprar">Comprar</label>
        <input type="radio" name="decision" id="comprar">
        
        <label for="vender">Vender</label>
        <input type="radio" name="decision" id="vender">
        
        <h4>Categorías de interés</h4>
        <label for="electro">Electro</label>
        <input type="checkbox" name="intereses" id="electro">

        <label for="moda">Moda</label>
        <input type="checkbox" name="intereses" id="moda">

        <label for="hogar">Hogar</label>
        <input type="checkbox" name="intereses" id="hogar">

        <label for="jugueteria">Juguetería</label>
        <input type="checkbox" name="intereses" id="jugueteria">

        <label for="vida_sana">Vida sana</label>
        <input type="checkbox" name="intereses" id="vida_sana">

        <label for="foto_usuario">Foto de usuario:</label>
        <input type="file" name="foto_usuario" id="foto_usuario">

        <label for="contraseña">Contraseña:</label>
        <input type="password" name="contraseña" id="contraseña">

        <label for="confirmar_contraseña">Confirmar contraseña:</label>
        <input type="password" name="confirmar_contraseña" id="confirmar_contraseña">

        <input type="submit" value="Enviar">
        <input type="reset" value="Borrar datos">
    </form>
</body>
</html>
